# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.12.2"
  python_check_max: "3.15"

package:
  name: pyproject-api
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pyproject-api/pyproject_api-${{ version }}.tar.gz
  sha256: ad2a72516abcc950877222e9eff760c9120d2086f0d9fce6aef4f16985a3e946

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - hatch-fancy-pypi-readme >=25.1
    - hatch-vcs >=0.5
    - hatchling >=1.32.4
    - pip
    - python ${{ python_min }}.*
  run:
    - packaging >=26.3
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/pyproject-api/**
      site_packages:
        - pyproject_api/**
        - pyproject_api-${{ version }}.dist-info/**
  - python:
      imports: pyproject_api
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - tests/
    requirements:
      run:
        - coverage
        - pytest
        - pytest-mock
        - python ${{ python_min }}.*
        - setuptools
        - virtualenv
    script:
      - coverage run -m --source pyproject_api --branch -m pytest -vv --color=yes --tb=long -k "not setuptools_prepare_metadata_for_build_wheel"
      - coverage report --show-missing --skip-covered --fail-under=76

about:
  summary: API to interact with the python pyproject.toml based projects
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/pyproject-api
  repository: https://github.com/tox-dev/pyproject-api

extra:
  recipe-maintainers:
    - bollwyvl
